<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시장 체력 일간·주간·월간 점수표</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#17202a;font-family:Arial,"Noto Sans KR",sans-serif}.wrap{max-width:1500px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:18px}.controls{display:flex;gap:7px;flex-wrap:wrap}h1{margin:0 0 7px;font-size:27px}.sub,.muted,.small{font-size:12px;color:#687681}.card{background:#fff;border:1px solid #dfe4e8;border-radius:12px;padding:16px;margin-top:15px}.grid{display:grid;grid-template-columns:1.45fr .75fr;gap:15px}.grid .card{margin-top:0}.full{grid-column:1/-1}button,input{font:inherit;border:1px solid #cdd5dc;border-radius:8px;background:#fff;padding:8px 10px}button{cursor:pointer}.active{background:#17202a;color:#fff}.score{font-size:45px;font-weight:800}.bar{height:12px;background:#e9edf0;border-radius:99px;margin:12px 0}.barin{height:100%;background:#687681;border-radius:99px}.port{font-size:15px;line-height:2.1}.port b{display:inline-block;width:58px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px 7px;border-bottom:1px solid #edf0f2;text-align:left;vertical-align:top}th{color:#687681}td:nth-child(3){text-align:center;font-weight:700}.tag{padding:3px 8px;border-radius:99px}.p2{background:#def2e3}.p1{background:#eaf6ed}.z{background:#eef1f3}.n1{background:#fff0e3}.n2{background:#fde5e5}a{color:#3567a8;text-decoration:none}canvas{width:100%;height:280px;border:1px solid #edf0f2;border-radius:8px}@media(max-width:950px){.top,.grid{display:block}.card{margin-top:15px}}
</style></head><body><div class="wrap"><div class="top"><div><h1>시장 체력 일간·주간·월간 점수표</h1><div class="sub">12개 지표 × -2~+2점 = 총 24점 · GitHub Actions가 매일 자동 갱신</div></div><div class="controls"><button id=d class=active>일간</button><button id=w>주간</button><button id=m>월간</button><input id=sel type=date><button id=today>오늘</button><button id=refresh>↻ 새로고침</button></div></div><div id=status class="card muted">데이터를 읽는 중…</div><div class=grid><section class=card><h2>시장 체력 점수</h2><span id=total class=score>—</span> <span id=regime></span><div class=bar><div id=bar class=barin></div></div><div class=small>+9~+24 강한 확장 · +5~+8 우호 · +1~+4 개선 가능 · 0 중립 · -1~-4 주의 · -5~-8 긴축 우세 · -9~-24 위험</div></section><section class=card><h2>기준 포트폴리오</h2><div class=port><div><b>QQQ</b>30%</div><div><b>VOO</b>28%</div><div><b>SCHD</b>10%</div><div><b>BTC</b>12%</div><div><b>현금</b>20%</div></div></section><section class="card full"><h2>12개 지표</h2><table><thead><tr><th>지표</th><th>현재값</th><th>점수</th><th>판정 근거</th><th>원천</th></tr></thead><tbody id=rows></tbody></table></section><section class="card full"><h2>총점 변화</h2><canvas id=line width=1400 height=320></canvas><div class=muted>x축=날짜 · y축=-24~+24</div></section><section class="card full"><h2>자동화 상태</h2><div id=auto class=small></div></section></div></div>
<script>
const N={M1:'M1 통화량',M2:'M2 통화량',RRP:'연준 역레포(RRP)',TGA:'미 재무부 TGA',RES:'연준 준비금',EARN:'기업실적',AI:'AI 투자 사이클',BTC:'비트코인',Y10:'미국 10년물',DXY:'달러지수',KOSPI:'외국인 KOSPI 순매수',SENT:'시장 심리(CNN/CMC)'};
const S={M1:'https://fred.stlouisfed.org/series/M1SL',M2:'https://fred.stlouisfed.org/series/M2SL',RRP:'https://www.newyorkfed.org/markets/desk-operations/reverse-repo',TGA:'https://fiscaldata.treasury.gov/datasets/daily-treasury-statement/',RES:'https://fred.stlouisfed.org/series/WRESBAL',EARN:'https://www.factset.com/insight/earnings-insight',AI:'https://www.iea.org/reports/energy-and-ai',BTC:'https://www.coingecko.com/en/coins/bitcoin/krw',Y10:'https://fred.stlouisfed.org/series/DGS10',DXY:'https://fred.stlouisfed.org/series/DTWEXBGS',KOSPI:'https://global.krx.co.kr/',SENT:'https://edition.cnn.com/markets/fear-and-greed'};
let period='daily',H=[],L={};const $=x=>document.getElementById(x);function tag(s){return '<span class="tag '+(s>=2?'p2':s==1?'p1':s==0?'z':s==-1?'n1':'n2')+'>'+((s>0?'+':'')+s)+'</span>'}function regime(s){return s>=9?'강한 확장 구간':s>=5?'우호 구간':s>=1?'개선 가능 구간':s===0?'중립 구간':s>=-4?'주의 구간':s>=-8?'긴축 우세 구간':'위험 구간'}function fmt(v){return v==null?'—':Number(v).toLocaleString('ko-KR',{maximumFractionDigits:2})}
function display(k,v){if(!v)return'—';if(k=='M1'||k=='M2')return fmt(v.value)+' B';if(k=='RES')return fmt(v.value/1000)+' T';if(k=='RRP'||k=='TGA')return'$'+fmt(v.value)+' B';if(k=='Y10')return Number(v.value).toFixed(2)+' %';if(k=='DXY')return Number(v.value).toFixed(2);if(k=='BTC')return'₩'+fmt(v.value);if(k=='SENT')return fmt(v.value)+' / 100';return v.display||'—'}function render(d){let total=0;Object.keys(N).forEach(k=>total+=Number((d[k]||{}).score||0));$('total').textContent=(total>0?'+':'')+total;$('regime').textContent=regime(total);$('bar').style.width=((total+24)/48*100)+'%';$('rows').innerHTML=Object.keys(N).map(k=>{let v=d[k]||{},s=Number(v.score||0);return`<tr><td><b>${N[k]}</b></td><td>${display(k,v)}</td><td>${tag(s)}</td><td>${v.note||v.source||'자동 수집'}</td><td><a href="${S[k]}" target="_blank" rel="noopener">원천 ↗</a></td></tr>`}).join('');return total}
function week(d){let x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),day=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-day);let y=x.getUTCFullYear(),s=new Date(Date.UTC(y,0,1));return y+'-W'+String(Math.ceil((((x-s)/86400000)+1)/7)).padStart(2,'0')}
function setP(p){period=p;d.classList.toggle('active',p=='daily');w.classList.toggle('active',p=='weekly');m.classList.toggle('active',p=='monthly');let x=new Date();sel.type=p=='daily'?'date':p=='weekly'?'week':'month';sel.value=p=='daily'?x.toISOString().slice(0,10):p=='weekly'?week(x):x.toISOString().slice(0,7)}
function filtered(){if(period=='daily')return H.filter(x=>x.date==sel.value);if(period=='monthly')return H.filter(x=>x.date.startsWith(sel.value));return H.filter(x=>week(new Date(x.date+'T00:00:00'))==sel.value)}
function draw(a){let c=$('line'),x=c.getContext('2d'),W=c.width,h=c.height,p={l:55,r:20,t:15,b:38};x.clearRect(0,0,W,h);for(let s=-24;s<=24;s+=8){let y=p.t+(24-s)/48*(h-p.t-p.b);x.strokeStyle='#e2e7eb';x.beginPath();x.moveTo(p.l,y);x.lineTo(W-p.r,y);x.stroke();x.fillStyle='#687681';x.font='11px Arial';x.fillText(s,p.l-28,y+4)}a=[...a].sort((u,v)=>u.date.localeCompare(v.date));if(!a.length)return;x.strokeStyle='#3567a8';x.lineWidth=2;x.beginPath();a.forEach((v,i)=>{let xx=p.l+(a.length==1?.5:i/(a.length-1))*(W-p.l-p.r),yy=p.t+(24-v.total)/48*(h-p.t-p.b);i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.stroke()}
function apply(){let a=filtered();if(period=='daily'&&a.length){render(a[0].items)}else if(a.length){let avg=a.reduce((s,v)=>s+v.total,0)/a.length;$('total').textContent=(avg>0?'+':'')+avg.toFixed(1);$('regime').textContent=regime(Math.round(avg));$('bar').style.width=((avg+24)/48*100)+'%'}draw(a)}
async function load(){try{let l=await fetch('data/latest.json?'+Date.now()),h=await fetch('data/history.json?'+Date.now());L=await l.json();H=(await h.json()).history||[];render(L.items||{});apply();$('status').textContent=`데이터 엔진 연결 완료 · 마지막 수집 ${L.generated_at||'—'} · 총점 ${(L.total>0?'+':'')}${L.total}/24`;$('auto').innerHTML='<b>자동:</b> M1 · M2 · RRP · TGA · 준비금 · 10Y · DXY · BTC<br><b>수동:</b> 기업실적 · AI 투자 · KOSPI 외국인 수급 · CNN/CMC 심리 endpoint는 별도 검토 필요<br><b>스케줄:</b> GitHub Actions가 매일 KST 08:00에 수집 후 JSON을 갱신합니다.'}catch(e){$('status').textContent='데이터 파일을 읽지 못했습니다. GitHub Pages로 배포한 주소에서 열어주세요.'}}
d.onclick=()=>{setP('daily');apply()};w.onclick=()=>{setP('weekly');apply()};m.onclick=()=>{setP('monthly');apply()};today.onclick=()=>{setP(period);apply()};sel.onchange=apply;refresh.onclick=load;setP('daily');load();
</script></body></html>
